# Membuat installer Windows dan menerbitkannya ke GitHub Releases setiap nomor versi di package.json naik.
# Dynamic Island di laptop memeriksa Releases ini untuk pembaruan otomatis.
name: Rilis Windows

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/rilis.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek apakah versi ini sudah dirilis
        id: cek
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "versi=$VER" >> $GITHUB_OUTPUT
          if [ "$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "Versi v$VER sudah ada di Releases, tidak dibuat ulang."
            echo "lewati=1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.cek.outputs.lewati != '1'
        with:
          node-version: 22
          cache: npm
      - name: Pasang paket
        if: steps.cek.outputs.lewati != '1'
        run: npm ci
      - name: Siapkan rilis draf v${{ steps.cek.outputs.versi }}
        if: steps.cek.outputs.lewati != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.cek.outputs.versi }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Dynamic Island $TAG" --notes "Pembaruan Dynamic Island $TAG."
      - name: Buat installer & terbitkan v${{ steps.cek.outputs.versi }}
        if: steps.cek.outputs.lewati != '1'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terbitkan rilis
        if: steps.cek.outputs.lewati != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.cek.outputs.versi }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
