<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Widget Desktop</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="tumpuk">
    <!-- Kartu: Jam digital besar -->
    <section class="kartu" id="k-jam">
      <div class="seret jm-isi">
        <div id="jm-waktu"><span id="jm-hm"></span><span id="jm-dt"></span></div>
        <div id="jm-tgl"></div>
        <div id="jm-info" class="muted"></div>
      </div>
    </section>

    <!-- Kartu: Sholat & Cuaca -->
    <section class="kartu" id="k-sc">
      <header class="seret">
        <div>
          <div id="sc-tgl" class="judul"></div>
          <div id="sc-lok" class="muted kecil"></div>
        </div>
        <button id="sc-segar" class="ikon" title="Perbarui cuaca">⟳</button>
      </header>

      <div id="cu">
        <div id="cu-kini"></div>
        <div id="cu-jam"></div>
      </div>

      <div id="sh">
        <div id="sh-next"></div>
        <div id="sh-list"></div>
      </div>
    </section>

    <!-- Kartu: Jadwal pelajaran -->
    <section class="kartu" id="k-jd">
      <header class="seret">
        <div>
          <div id="jd-judul" class="judul"></div>
          <div id="jd-sub" class="muted kecil"></div>
        </div>
      </header>
      <div id="jd-kini"></div>
      <ul id="jd-list"></ul>
    </section>

    <!-- Kartu: Kalender -->
    <section class="kartu" id="k-kal">
      <header class="seret">
        <div class="judul" id="kal-judul"></div>
        <div class="kal-nav">
          <button class="ikon" id="kal-prev" title="Bulan sebelumnya">‹</button>
          <button class="ikon" id="kal-ini" title="Bulan ini">●</button>
          <button class="ikon" id="kal-next" title="Bulan berikutnya">›</button>
        </div>
      </header>
      <div id="kal-grid"></div>
      <div id="kal-info"></div>
    </section>
    <!-- Kartu: Kelas hari ini (presensi + jurnal) -->
    <section class="kartu" id="k-kh">
      <header class="seret">
        <div>
          <div class="judul">🧒 Kelas <span id="kh-kelas"></span> hari ini</div>
          <div id="kh-sub" class="muted kecil"></div>
        </div>
        <button class="ikon" id="kh-segar" title="Perbarui">⟳</button>
      </header>
      <div id="kh-isi"></div>
    </section>

    <!-- Kartu: Daftar tugas -->
    <section class="kartu" id="k-tg">
      <header class="seret">
        <div>
          <div class="judul">✅ Tugas</div>
          <div id="tg-sub" class="muted kecil"></div>
        </div>
      </header>
      <form id="tg-form" autocomplete="off">
        <input id="tg-teks" placeholder="Tambah tugas…" maxlength="300">
        <input id="tg-tgl" type="date" title="Tenggat (boleh kosong)">
      </form>
      <ul id="tg-list"></ul>
      <button id="tg-selesai-tgl" class="tautan" hidden></button>
      <ul id="tg-done" hidden></ul>
    </section>

    <!-- Kartu: Catatan cepat -->
    <section class="kartu" id="k-ct">
      <header class="seret">
        <div class="judul">🗒️ Catatan</div>
        <span id="ct-status" class="muted kecil"></span>
      </header>
      <textarea id="ct-teks" placeholder="Tulis catatan singkat di sini… tersimpan otomatis" maxlength="5000"></textarea>
    </section>

    <!-- Kartu: Ulang tahun siswa -->
    <section class="kartu" id="k-ut">
      <header class="seret">
        <div>
          <div class="judul">🎂 Ulang tahun siswa</div>
          <div id="ut-sub" class="muted kecil"></div>
        </div>
      </header>
      <ul id="ut-list"></ul>
    </section>
  </div>
  <script src="shared.js"></script>
  <script src="widget.js"></script>
</body>
</html>
